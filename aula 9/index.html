<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p {
       font-family: sans-serif;
       font-weight: bold;
    }
    button {
        background-color: black;
        color: aliceblue;
        border-color: black;
    }
    .exercicio {
        display: grid;
        text-align: center;
        justify-content: center;
        margin-bottom: 3cm;
    }
    input {
        display: block;
        width: 100%;
    }
    #trollface {
        border: 3px solid black;
    }
</style>
<body>
    <div class="exercicio">
        <p id="paragrafo">Texto inicial</p>
        <button>Alterar texto</button>
    </div>

    <div class="exercicio">
        <input type="text">
        <p id="listener"></p>
    </div>
    <div class="exercicio">
        <img id="trollface" src="./public/images.jpeg">
    </div>
</body>
<script src="script.js"></script>
</html>
